name: Test

on:
  # Pushes to main run the suite too: a site that commits straight to main
  # would otherwise never learn that its checks broke.
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
  merge_group:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # .image-cache: processed images for the site build (keyed on sources)
      # *.tsbuildinfo: incremental tsc state for typecheck + typecheck:strict
      # pages-cms cache: schema clone used by pages-yml-validation.test.js,
      # so CI runs don't depend on a live git clone of an external repo
      - name: Cache build and typecheck state
        uses: actions/cache@v4
        with:
          path: |
            .image-cache
            tsconfig.tsbuildinfo
            tsconfig.strict.tsbuildinfo
            /tmp/pages-cms-validation-cache
          key: test-state-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json', 'src/images/**') }}
          restore-keys: |
            test-state-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --verbose

  # The template's tests travel with every site forked from it. This job
  # deletes the demo content and rewrites the site data the way a fork does,
  # then runs the whole suite against that copy, so a test that leans on demo
  # content fails here rather than in the first fork that deletes it.
  fork-simulation:
    name: Fork Simulation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests in a simulated fork
        run: npm run test:fork
