{%- if faqs.size > 0 -%}
<div class="faqs">
  {%- for faq in faqs -%}
  <details class="faqs__item">
    <summary class="faqs__question">
      {{- faq.question -}}
      <svg class="faqs__chevron" aria-hidden="true" focusable="false" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </summary>
    <div class="faqs__answer prose">{{ faq.answer }}</div>
  </details>
  {%- endfor -%}
</div>
{%- endif -%}
