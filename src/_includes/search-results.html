{%- comment -%}
Search results component.
Hosts the Pagefind result list and load-more control.
The frontend search script populates the inner elements.
{%- endcomment -%}

<div data-pagefind-ignore>
  <div
    id="search-results"
    data-no-results-label="{{ pageLanguage.no_results_label }}"
    data-result-count-one-label="{{ pageLanguage.result_count_one_label }}"
    data-result-count-other-label="{{ pageLanguage.result_count_other_label }}"
  >
    <p class="search-message"></p>
    <ul class="search-results-list"></ul>
    <button class="search-load-more btn btn--secondary" hidden>{{ pageLanguage.load_more_label }}</button>
  </div>
</div>
